services:
  grafana:
    environment:
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
      GF_RENDERING_RENDERER_TOKEN: shop-local-rendering

  renderer:
    image: grafana/grafana-image-renderer:v5.12.6
    profiles: [screenshots]
    environment:
      AUTH_TOKEN: shop-local-rendering
      GOMEMLIMIT: 128MiB
    shm_size: 256mb
