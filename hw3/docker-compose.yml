
services:
  shop-api:
    build: .
    restart: always
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus
    volumes:
      - ./settings/prometheus:/etc/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    restart: always

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    restart: always
