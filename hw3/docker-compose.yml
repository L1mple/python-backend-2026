services:
  shop-api:
    build:
      context: ..
      dockerfile: hw3/Dockerfile
    ports:
      - "8000:8000"

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./settings/prometheus:/etc/prometheus:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      NO_PROXY: prometheus,localhost,127.0.0.1
      no_proxy: prometheus,localhost,127.0.0.1
    ports:
      - "3000:3000"
