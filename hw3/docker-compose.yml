services:
  local:
    build:
      context: ..
      dockerfile: hw3/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://shop_app:shop_local@postgres:5432/shop_db
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    ports:
      - "8080:8080"

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: shop_db
      POSTGRES_USER: shop_app
      POSTGRES_PASSWORD: shop_local
    ports:
      - "5433:5432"
    volumes:
      - shop-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop_app -d shop_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always

  prometheus:
    image: prom/prometheus
    restart: always
    volumes:
      - ./settings/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    restart: always
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  shop-data:
  prometheus-data:
  grafana-data:
