services:

  local:
    build:
      # Контекст - корень репозитория, чтобы Dockerfile мог скопировать
      # сервис из hw2/hw без дублирования кода.
      context: ..
      dockerfile: hw3/Dockerfile
      target: local
    restart: always
    ports:
      - 8080:8080
    environment:
      # hw4: shop_api теперь хранит данные в MySQL вместо памяти.
      DATABASE_URL: mysql+pymysql://shop:shop@mysql:3306/shop_api
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: hw4_mysql
    environment:
      MYSQL_DATABASE: shop_api
      MYSQL_USER: shop
      MYSQL_PASSWORD: shop
      MYSQL_ROOT_PASSWORD: root
    ports:
      # наружу - на нестандартном порту, чтобы не конфликтовать с локальным MySQL
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  grafana:
    image: grafana/grafana:latest
    ports:
      - 3000:3000
    restart: always

  prometheus:
    image: prom/prometheus
    volumes:
      - ./settings/prometheus/:/etc/prometheus/
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    ports:
      - 9090:9090
    restart: always

volumes:
  mysql_data:
