services:
  shop:
    build:
      context: ..
      dockerfile: hw3/Dockerfile
    ports:
      - "8080:8080"
    restart: always

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./settings/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    depends_on:
      - shop
    restart: always

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: always