services:
  local:
    build:
      context: ..
      dockerfile: hw3/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"

  grafana:
    image: grafana/grafana:13.2.3
    volumes:
      - ./settings/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./settings/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./settings/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"

  prometheus:
    image: prom/prometheus:v3.15.0
    volumes:
      - ./settings/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "127.0.0.1:9090:9090"
