repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: make lint-ruff
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: make lint-mypy
        language: system
        types: [python]
        pass_filenames: false

      - id: tests
        name: tests
        entry: make test
        language: system
        types: [python]
        pass_filenames: false
