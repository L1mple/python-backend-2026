services:
  shop:
    build: .
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus
    volumes:
      - ./settings/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - shop

  grafana:
    image: grafana/grafana
    volumes:
      - ./settings/grafana/provisioning/:/etc/grafana/provisioning/:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
