services:
  shop-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: local
    ports:
      - "8080:8080"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.6.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./settings/prometheus/:/etc/prometheus/:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - shop-api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.0
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
