services:
  shop:
    build: .
    ports:
      - 8080:8080

  prometheus:
    image: prom/prometheus
    volumes:
      - ./settings/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - 9090:9090

  grafana:
    image: grafana/grafana
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - 3000:3000

volumes:
  grafana-data:
