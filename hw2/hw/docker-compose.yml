services:
  shop-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: local
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus
    volumes:
      - ./settings/prometheus:/etc/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"