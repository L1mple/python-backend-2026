services:
  shop-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: local
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:password@postgres:5432/hw4_db
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus
    volumes:
      - ./settings/prometheus:/etc/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: hw4_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "7432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  db_data: