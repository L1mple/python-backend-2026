services:

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    ports:
      - "5432:5432"

  local:
    build: .
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg2://shop:shop@postgres:5432/shop
    depends_on:
      - postgres
    ports:
      - 8080:8080

  grafana:
    image: grafana/grafana:latest
    ports:
      - 3000:3000
    restart: always

  prometheus:
    image: prom/prometheus
    volumes:
      - ./settings/prometheus/:/etc/prometheus/
    ports:
      - 9090:9090
    restart: always
