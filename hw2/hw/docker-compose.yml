services:
  shop:
    build: .
    ports:
      - 8000:8080
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/shop
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - 7432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus
    volumes:
      - ./settings/prometheus/:/etc/prometheus/
    ports:
      - 9090:9090
    restart: always

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./settings/grafana/:/etc/grafana/provisioning/
    ports:
      - 3000:3000
    restart: always

volumes:
  postgres_data:
