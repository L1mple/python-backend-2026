version: "3"

services:

  db:
    image: postgres:15
    container_name: hw4_postgres
    environment:
      POSTGRES_DB: hw4_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "7432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - monitoring

  local:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: local
    restart: always
    ports:
      - 8080:8080
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/hw4_db
    depends_on:
        - db
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    ports:
      - 3000:3000
    restart: always
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus
    volumes:
      - ./settings/prometheus/:/etc/prometheus/
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    ports:
      - 9090:9090
    restart: always
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge

volumes:
  postgres_data: