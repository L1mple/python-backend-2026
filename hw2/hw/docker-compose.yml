services:
  shop_api:
    build:
      context: .
      dockerfile: ./Dockerfile
    restart: always
    ports:
      - 8080:8080

  prometheus:
    image: prom/prometheus
    volumes:
      - ./settings/prometheus/:/etc/prometheus/
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - 9090:9090
    restart: always
    depends_on:
      - shop_api

  grafana:
    image: grafana/grafana:latest
    ports:
      - 3000:3000
    restart: always
    depends_on:
      - prometheus