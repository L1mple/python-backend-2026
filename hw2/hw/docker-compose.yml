services:
  shop:
    build: .
    ports:
      - 8080:8080
    restart: always

  prometheus:
    image: prom/prometheus
    volumes:
      - ./settings/prometheus/:/etc/prometheus/
    ports:
      - 9090:9090
    restart: always

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./settings/grafana/:/etc/grafana/provisioning/
    ports:
      - 3000:3000
    restart: always
