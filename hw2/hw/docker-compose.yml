services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    # Порт открыт только на localhost: для тестов и скриптов с хоста
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # С версии 18 образ хранит данные в /var/lib/postgresql/18/docker,
      # поэтому том монтируется на уровень выше, а не в .../data
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  shop:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://shop:shop@postgres:5432/shop
    ports:
      - "127.0.0.1:8080:8080"
    # Сервис стартует, когда PostgreSQL уже принимает соединения
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.0
    volumes:
      - ./settings/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - shop
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      # Дашборды открываются без входа только на просмотр; admin/admin для правки
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/shop-http.json
    volumes:
      - ./settings/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./settings/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres-data:
