services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shop"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  shop_api:
    build:
      context: .
      dockerfile: ./Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:password@postgres:5432/shop
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    ports:
      - 8080:8080

  prometheus:
    image: prom/prometheus
    volumes:
      - ./settings/prometheus/:/etc/prometheus/
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - 9090:9090
    restart: always
    depends_on:
      - shop_api

  grafana:
    image: grafana/grafana:latest
    ports:
      - 3000:3000
    restart: always
    depends_on:
      - prometheus

volumes:
  postgres_data: