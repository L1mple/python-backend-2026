[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["test_homework2.py", "tests"]

[tool.coverage.run]
source = ["shop_api"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
