name: "HW5 Тесты"

on:
  pull_request:
    branches: [ main ]
    paths: [ 'hw2/hw/**', 'lecture5/hw/**', '.github/workflows/hw5-tests.yml' ]
  push:
    branches: [ hw5, main ]
    paths: [ 'hw2/hw/**', 'lecture5/hw/**', '.github/workflows/hw5-tests.yml' ]

jobs:
  test-hw5:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: shop
          MYSQL_USER: shop
          MYSQL_PASSWORD: shop
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ushop -pshop"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.13"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r lecture5/hw/requirements.txt

    - name: Run tests
      env:
        PYTHONPATH: ${{ github.workspace }}
        DATABASE_URL: mysql+pymysql://shop:shop@127.0.0.1:3306/shop
      run: |
        pytest -vv --cov=hw2/hw/shop_api --cov-report=term-missing --cov-fail-under=95 lecture5/hw
