name: HW5 Tests and Coverage

on:
  pull_request:
    branches: [main]
    paths:
      - 'hw2/hw/**'
      - 'hw5/**'
      - '.github/workflows/hw5-tests.yml'
  push:
    branches: [hw5, main]
    paths:
      - 'hw2/hw/**'
      - 'hw5/**'
      - '.github/workflows/hw5-tests.yml'

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r hw2/hw/requirements.txt pytest-cov

      - name: Run HW2 and HW5 tests with 95% coverage gate
        env:
          PYTHONPATH: ${{ github.workspace }}/hw2/hw
        run: |
          python -m pytest -v hw2/hw/test_homework2.py hw5/tests \
            --cov=shop_api \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=95

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hw5-coverage-report
          path: coverage.xml
          if-no-files-found: ignore
