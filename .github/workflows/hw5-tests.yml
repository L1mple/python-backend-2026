name: "HW5 Tests"

# Запускаем тесты при изменении файлов в hw5/
on:
  pull_request:
    branches: [ main ]
    paths: [ 'hw5/**', '.github/workflows/hw5-tests.yml' ]
  push:
    branches: [ main ]
    paths: [ 'hw5/**', '.github/workflows/hw5-tests.yml' ]

jobs:
  test-hw5:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop
          POSTGRES_DB: shop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shop -d shop"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      DATABASE_URL: postgresql+asyncpg://shop:shop@localhost:5432/shop_test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      working-directory: hw5
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests (in-memory storage)
      working-directory: hw5
      env:
        STORAGE_BACKEND: memory
      run: |
        pytest -v --cov --cov-report=

    - name: Run tests (PostgreSQL storage)
      working-directory: hw5
      env:
        STORAGE_BACKEND: postgres
      run: |
        pytest -v --cov --cov-append --cov-report=

    - name: Check coverage
      working-directory: hw5
      run: |
        coverage report --fail-under=90
