name: HW5 Tests

on:
  push:
    paths:
      - 'hw2/hw/**'
      - 'hw4/test_database.py'
      - 'hw5/**'
      - '.github/workflows/hw5-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'hw2/hw/**'
      - 'hw4/test_database.py'
      - 'hw5/**'
      - '.github/workflows/hw5-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-hw5:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: shop_test
          MYSQL_USER: shop
          MYSQL_PASSWORD: shop
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="MYSQL_PWD=shop mysql -h 127.0.0.1 -u shop shop_test -e 'SELECT 1'"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
          --health-start-period=20s
    env:
      DATABASE_URL: mysql+pymysql://shop:shop@127.0.0.1:3306/shop_test?charset=utf8mb4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            hw2/hw/requirements.txt
            hw5/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r hw5/requirements.txt
      - name: Run tests and enforce coverage
        run: python -m pytest -c hw5/pytest.ini hw2/hw hw4/test_database.py hw5/tests -q
      - name: Upload coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: warn
