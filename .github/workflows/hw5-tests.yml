name: HW5 Tests

on:
  pull_request:
    branches: [main]
    paths: ['hw5/**', 'hw4/**', 'hw2/hw/**', '.github/workflows/hw5-tests.yml']
  push:
    branches: [hw5]
    paths: ['hw5/**', 'hw4/**', 'hw2/hw/**', '.github/workflows/hw5-tests.yml']

jobs:
  coverage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop
          POSTGRES_DB: shop_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U shop -d shop_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://shop:shop@127.0.0.1:5432/shop_test
      PYTHONPATH: hw2/hw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r hw5/requirements.txt
      - run: >-
          python -m pytest hw2/hw/test_homework2.py hw4 hw5 -v
          --cov=shop_api --cov-config=hw5/coverage.ini
          --cov-report=term-missing --cov-report=xml:coverage.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shop-coverage
          path: coverage.xml
