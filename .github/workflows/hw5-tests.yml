name: "HW5 Tests"

on:
  pull_request:
    branches: [ main ]
    paths: [ 'hw2/hw/**', '.github/workflows/hw5-tests.yml' ]
  push:
    paths: [ 'hw2/hw/**', '.github/workflows/hw5-tests.yml' ]

jobs:
  test-hw5:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: shop
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install dependencies
      working-directory: hw2/hw
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests with coverage
      working-directory: hw2/hw
      env:
        PYTHONPATH: ${{ github.workspace }}/hw2/hw
        DATABASE_URL: postgresql+psycopg2://postgres:password@localhost:5432/shop
      run: |
        pytest -v --cov=shop_api --cov-report=term-missing --cov-fail-under=95
