name: "HW5 Tests"

on:
  pull_request:
    branches: [ main ]
    paths: [ 'hw2/hw/**', '.github/workflows/hw5-tests.yml' ]
  push:
    branches: [ main ]
    paths: [ 'hw2/hw/**', '.github/workflows/hw5-tests.yml' ]

jobs:
  test-hw5:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: hw4_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install dependencies
      working-directory: hw2/hw
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install coverage

    - name: Init DB schema
      env:
        PGPASSWORD: password
      run: |
        psql -h localhost -U postgres -d hw4_db -f hw2/hw/migrations/init.sql

    - name: Run tests with coverage
      working-directory: hw2/hw
      env:
        PYTHONPATH: ${{ github.workspace }}/hw2/hw
        DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/hw4_db
      run: |
        coverage run --concurrency=thread,greenlet --parallel-mode -m pytest test_homework2.py test_coverage_extra.py -v
        coverage combine
        coverage report -m --fail-under=95