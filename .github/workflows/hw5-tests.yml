name: "HW5 Coverage"

# Проверяем покрытие HW2 по требованиям ДЗ5.
on:
  pull_request:
    branches: [ main ]
    paths: [ 'hw2/hw/**', '.github/workflows/hw5-tests.yml' ]
  push:
    paths: [ 'hw2/hw/**', '.github/workflows/hw5-tests.yml' ]

jobs:
  test-hw5:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: hw4_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hw4_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      working-directory: hw2/hw
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-hw5.txt

    - name: Run HW2 tests with coverage
      working-directory: hw2/hw
      env:
        PYTHONPATH: ${{ github.workspace }}/hw2/hw
        DATABASE_URL: postgresql+psycopg://postgres:password@localhost:5432/hw4_db
      run: |
        pytest -v --cov=shop_api --cov-report=term-missing --cov-fail-under=95
