name: 'HW5 Tests (coverage + Postgres)'

on:
  pull_request:
    branches: [main]
    paths: ['hw2/hw/**']
  push:
    branches: [main]
    paths: ['hw2/hw/**']

jobs:
  test-hw5:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13', '3.14']

    # Поднимаем PostgreSQL для тестов
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: shop_db
          POSTGRES_USER: shop_user
          POSTGRES_PASSWORD: shop_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: hw2/hw
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        working-directory: hw2/hw
        env:
          PYTHONPATH: ${{ github.workspace }}/hw2/hw
          DATABASE_URL: postgresql+asyncpg://shop_user:shop_password@localhost:5433/shop_db
        run: |
          pytest test_homework2.py test_extra.py --cov=shop_api --cov-report=term-missing --cov-fail-under=95 -v
