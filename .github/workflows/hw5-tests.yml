name: "HW5 Tests"

on:
  pull_request:
    branches: [ main ]
    paths: [ 'lecture5/hw/**', '.github/workflows/hw5-tests.yml' ]
  push:
    branches: [ main ]
    paths: [ 'lecture5/hw/**', '.github/workflows/hw5-tests.yml' ]

jobs:
  test-hw5:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      working-directory: lecture5/hw
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      working-directory: lecture5
      run: |
        pytest hw -v --cov=hw.shop_api --cov-report=term-missing --cov-fail-under=95
