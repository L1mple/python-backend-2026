name: HW5 Tests

on:
  push:
    paths: ['hw5/**', '.github/workflows/hw5-tests.yml']
  pull_request:
    branches: [main]
    paths: ['hw5/**', '.github/workflows/hw5-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: shop_test
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shop -d shop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: hw5
    env:
      TEST_DATABASE_URL: postgresql+psycopg://shop:shop@127.0.0.1:5432/shop_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests and check coverage
        run: python -m pytest test_shop_api.py --cov=shop_api --cov-report=term-missing --cov-fail-under=95
