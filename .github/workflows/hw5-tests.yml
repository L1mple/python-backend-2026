name: "HW5 Tests"

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'hw5/**'
      - 'hw2/hw/**'
  push:
    branches: [ main ]
    paths:
      - 'hw5/**'
      - 'hw2/hw/**'

jobs:
  test-hw5:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: hw4_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hw4_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install application dependencies
      working-directory: hw2/hw
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install test dependencies
      working-directory: hw5
      run: |
        pip install -r requirements.txt

    - name: Run tests
      working-directory: hw5
      env:
        PYTHONPATH: ${{ github.workspace }}/hw2/hw:${{ github.workspace }}/hw5
        DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/hw4_db
      run: |
        pytest my_tests.py -v \
          --cov=shop_api \
          --cov-report=term-missing \
          --cov-fail-under=95
