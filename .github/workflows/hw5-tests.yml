name: HW5 Tests

on:
  push:
    paths:
      - 'hw2/hw/**'
      - 'hw3/**'
      - 'hw4/**'
      - 'hw5/**'
      - '.github/workflows/hw5-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'hw2/hw/**'
      - 'hw3/**'
      - 'hw4/**'
      - 'hw5/**'
      - '.github/workflows/hw5-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.database }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
        database: [postgresql, sqlite]
    defaults:
      run:
        working-directory: hw5
    env:
      TEST_DATABASE_BACKEND: ${{ matrix.database }}
      DATABASE_URL: ${{ matrix.database == 'postgresql' && 'postgresql+psycopg://shop:shop@localhost:5432/hw5_test' || 'sqlite:///./hw5-test.db' }}
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/hw2/hw
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop
          POSTGRES_DB: hw5_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shop -d hw5_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            hw2/hw/requirements.txt
            hw3/requirements.txt
            hw5/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check database connection
        run: |
          python - <<'PY'
          import os
          from shop_api.database import get_engine
          from sqlalchemy import text

          engine = get_engine()
          assert engine.dialect.name == os.environ['TEST_DATABASE_BACKEND']
          with engine.connect() as connection:
              assert connection.scalar(text('SELECT 1')) == 1
          print(f'Database ready: {engine.dialect.name}')
          engine.dispose()
          PY
      - name: Test with coverage >= 95%
        run: python -m pytest -q
      - name: Upload coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.database }}-py${{ matrix.python-version }}
          path: |
            hw5/coverage.xml
            hw5/coverage.json
            hw5/htmlcov/
          if-no-files-found: ignore
          retention-days: 14
