name: hw5 tests

on:
  push:
    paths:
      - "hw5/**"
      - ".github/workflows/hw5-tests.yml"
  pull_request:
    paths:
      - "hw5/**"
      - ".github/workflows/hw5-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: hw5

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop
          POSTGRES_DB: shop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shop -d shop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg2://shop:shop@localhost:5432/shop_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            hw5/requirements.txt
            hw5/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests (coverage >= 95%)
        run: pytest