
name: HW5 Tests and Coverage

on:
  push:
    branches:
      - hw5
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r hw2/hw/requirements.txt
          python -m pip install pytest-cov

      - name: Run tests with coverage
        env:
          PYTHONPATH: hw2/hw
        run: |
          python -m pytest -q \
            hw2/hw/test_homework2.py \
            hw2/hw/test_hw5_chat.py \
            hw2/hw/test_hw5_edge_cases.py \
            --cov=shop_api \
            --cov=store \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=95
