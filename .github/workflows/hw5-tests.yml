name: "HW5 Tests"

on:
  pull_request:
    branches: [ main ]
    paths: [ 'hw4/**', '.github/workflows/hw5-tests.yml' ]
  push:
    paths: [ 'hw4/**', '.github/workflows/hw5-tests.yml' ]

jobs:
  test-hw5:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shop
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shop -d shop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      working-directory: hw4
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      working-directory: hw4
      env:
        DATABASE_URL: postgresql+psycopg://shop:shop@localhost:5432/shop
      run: |
        pytest -v --cov=shop_api --cov=store --cov-report=term-missing --cov-fail-under=95
