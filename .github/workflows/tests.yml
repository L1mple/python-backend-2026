name: tests

on:
  push:
    branches: [master, "main"]
  pull_request:
    branches: [master, "main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r hw2/hw/requirements.txt
      - run: |
          cd hw2/hw
          pytest test_homework2.py test_queries.py test_routes.py \
            --cov=shop_api \
            --cov-report=term-missing \
            --cov-fail-under=90 \
            -q
