name: tests

on:
  push:
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hw2/hw
    env:
      PYTHONPATH: ${{ github.workspace }}/hw2/hw
      DATABASE_URL: "sqlite+aiosqlite:///./shop_api_test.db"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: |
          pytest test_homework2.py test_queries.py test_routes.py \
            --cov=shop_api \
            --cov-report=term-missing \
            --cov-fail-under=90 \
            -q
