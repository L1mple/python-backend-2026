name: "HW2 Tests"

on:
  pull_request:
    branches: [main]
    paths:
      - "hw2/hw/**"
      - "lecture5/hw/**"
      - ".github/workflows/hw2-tests.yml"
      - "pytest.ini"
  push:
    paths:
      - "hw2/hw/**"
      - "lecture5/hw/**"
      - ".github/workflows/hw2-tests.yml"
      - "pytest.ini"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-hw2:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shop_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d shop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: hw2/hw/requirements.txt

      - name: Install dependencies
        working-directory: hw2/hw
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests with coverage
        working-directory: hw2/hw
        env:
          PYTHONPATH: ${{ github.workspace }}/hw2/hw
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://postgres:postgres@127.0.0.1:5432/shop_test' || 'sqlite://' }}
        run: >-
          python -m pytest -v
          --cov=shop_api
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-fail-under=95

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}-${{ matrix.database }}
          path: hw2/hw/coverage.xml
          if-no-files-found: ignore
