name: "HW2 Tests"

# Запускаем тесты при изменении файлов в hw2/hw/
on:
  pull_request:
    branches: [ main ]
    paths: [ 'hw2/hw/**', 'hw4/**', '.github/workflows/hw2-tests.yml' ]
  push:
    branches: [ main ]
    paths: [ 'hw2/hw/**', 'hw4/**', '.github/workflows/hw2-tests.yml' ]

jobs:
  test-hw2:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: shop_test
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shop -d shop_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://shop:shop@localhost:5432/shop_test
      TEST_DATABASE_URL: postgresql+psycopg://shop:shop@localhost:5432/shop_test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      working-directory: hw2/hw
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      working-directory: hw2/hw
      env:
        PYTHONPATH: ${{ github.workspace }}/hw2/hw
      run: |
        pytest test_homework2.py test_storage.py -v

    - name: Run isolation examples
      run: python hw4/isolation.py
