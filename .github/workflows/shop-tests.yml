name: HW5 Shop API tests

on:
  push:
    branches: [main, hw5]
    paths: ['hw2/hw/**', '.github/workflows/shop-tests.yml', 'docker-compose.yml', 'scripts/transaction_demo.py']
  pull_request:
    branches: [main]
    paths: ['hw2/hw/**', '.github/workflows/shop-tests.yml', 'docker-compose.yml', 'scripts/transaction_demo.py']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: student
          POSTGRES_PASSWORD: student
          POSTGRES_DB: shop_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U student -d shop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: hw2/hw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: hw2/hw/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Run tests and check coverage
        env:
          SHOP_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://student:student@localhost:5432/shop_test' || 'sqlite:///:memory:' }}
        run: >-
          python -m pytest test_homework2.py tests -v
          --cov=shop_api --cov-branch --cov-report=term-missing
          --cov-report=xml:coverage.xml --cov-fail-under=95
      - name: Check PostgreSQL isolation examples
        if: matrix.database == 'postgres'
        env:
          TRANSACTION_DATABASE_URL: postgresql+psycopg://student:student@localhost:5432/shop_test
        run: python ../../scripts/transaction_demo.py
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}-${{ matrix.database }}
          path: hw2/hw/coverage.xml
