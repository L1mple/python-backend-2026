name: HW2 solution tests

on:
  push:
    branches: [hw2]
    paths:
      - 'hw2/hw/**'
      - '.github/workflows/hw2-solution-tests.yml'
  pull_request:
    branches: [main, hw2, hw3]
    paths:
      - 'hw2/hw/**'
      - '.github/workflows/hw2-solution-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Test shop and chat
        env:
          PYTHONPATH: hw2/hw
        run: uv run --no-project --python ${{ matrix.python-version }} --with-requirements hw2/hw/requirements.txt pytest -q hw2/hw
