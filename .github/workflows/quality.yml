name: Homework quality checks

on:
  push:
    paths:
      - 'hw2/hw/**'
      - 'hw3/**'
      - 'hw4/**'
      - 'monitoring/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Makefile'
      - '.github/workflows/quality.yml'
  pull_request:
    branches: [main]
    paths:
      - 'hw2/hw/**'
      - 'hw3/**'
      - 'hw4/**'
      - 'monitoring/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Makefile'
      - '.github/workflows/quality.yml'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      HW4_TEST_DATABASE_URL: postgresql+psycopg://shop:shop@127.0.0.1:7432/shop
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shop
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop
        ports:
          - 7432:5432
        options: >-
          --health-cmd "pg_isready -U shop -d shop"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv and locked dependencies
        run: |
          python -m pip install uv==0.9.17
          uv sync --locked
      - name: Check formatting, lint and types
        run: make lint
      - name: Run instructor and additional tests
        run: make test
      - name: Check transaction isolation against PostgreSQL
        run: make demo-hw4
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
      - name: Build Shop API image with locked dependencies
        run: docker compose build shop-api
