services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    ports:
      - "127.0.0.1:7433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 3s
      timeout: 3s
      retries: 20

  shop:
    build:
      context: ..
      dockerfile: hw3/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://shop:shop@db:5432/shop
    ports:
      - "127.0.0.1:8004:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
