name: hw4

services:
  api:
    build:
      context: ..
      dockerfile: hw4/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://shop:shop@db:5432/shop
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - shop_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "shop", "-d", "shop"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  shop_data:
