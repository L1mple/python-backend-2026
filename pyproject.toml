[project]
name = "python-backend-2026"
version = "0.1.0"
description = "Homework assignments for the Python Backend course"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "uvicorn>=0.24.0",
]

[dependency-groups]
dev = [
    "async-asgi-testclient>=1.4.11",
    "httpx>=0.27.2",
    "mypy>=1.18.0",
    "pre-commit>=4.3.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.13.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-v --tb=short --strict-markers"
asyncio_mode = "auto"
markers = [
    "asyncio: marks tests as async",
]

[tool.ruff]
extend-exclude = ["hw*/test_*.py"]
line-length = 100
target-version = "py313"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ASYNC", "B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
