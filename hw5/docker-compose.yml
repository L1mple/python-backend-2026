name: python-backend-hw5

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: shop_test
      MYSQL_USER: shop
      MYSQL_PASSWORD: shop
      MYSQL_ROOT_PASSWORD: root
    ports:
      - '127.0.0.1:3308:3306'
    healthcheck:
      test: ['CMD-SHELL', 'MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER $$MYSQL_DATABASE -e "SELECT 1"']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
