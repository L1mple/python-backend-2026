[pytest]
pythonpath = .. ../hw2/hw
testpaths =
    ../hw2/hw/test_homework2.py
    ../hw3/test_monitoring.py
    ../hw4/tests
    tests
addopts =
    --strict-markers
    --cov=shop_api
    --cov-branch
    --cov-fail-under=95
    --cov-report=term-missing:skip-covered
    --cov-report=xml:coverage.xml
    --cov-report=html:htmlcov
    --cov-report=json:coverage.json
